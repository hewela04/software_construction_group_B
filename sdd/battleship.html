<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battleship</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #17324a;
        background: #eef4f7;
      }

      body {
        margin: 0;
      }

      .game-shell {
        max-width: 68rem;
        margin: 0 auto;
        padding: 1.5rem;
      }

      .setup-controls,
      .board-panel {
        background: #fff;
        border: 1px solid #b8cbd5;
        border-radius: 0.5rem;
        padding: 1rem;
      }

      .setup-controls {
        margin-block: 1.5rem;
      }

      .setup-options {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 2rem;
      }

      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
      }

      legend {
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .ship-options,
      .orientation-options {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
      }

      .board-layout {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .board-panel h2 {
        margin-top: 0;
      }

      .board-scroll {
        overflow-x: auto;
      }

      .board-table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        text-align: center;
      }

      .board-table th,
      .board-table td {
        border: 1px solid #9bb2bf;
        padding: 0.25rem;
      }

      .board-table thead th,
      .board-table tbody th {
        background: #dce9ef;
      }

      .board-table td {
        height: 2.5rem;
        background: #d2e7ee;
        padding: 0;
      }

      .board-cell {
        width: 100%;
        height: 100%;
        min-height: 2.5rem;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .board-cell.ship-cell {
        background: #8299a5;
      }

      .board-cell.preview-valid {
        background: #f2d77e;
      }

      .board-cell.preview-invalid {
        background: #efaaa5;
      }

      .board-cell.target-pending {
        background: #f2d77e;
      }

      .board-cell.shot-hit {
        background: #c94545;
        color: #fff;
      }

      .board-cell.shot-miss {
        background: #8299a5;
        color: #fff;
      }

      .board-cell.ship-sunk {
        box-shadow: inset 0 0 0 3px #17324a;
        font-weight: 800;
      }

      .board-cell:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #174e70;
        outline-offset: 2px;
        position: relative;
        z-index: 1;
      }

      .placement-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      #placement-status {
        min-height: 1.5em;
        margin: 0;
      }

      .coordinate-corner {
        width: 2rem;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <h1>Battleship</h1>

      <section class="setup-controls" aria-labelledby="setup-heading">
        <h2 id="setup-heading">Set up your fleet</h2>
        <div class="setup-options">
          <fieldset>
            <legend>Select a ship</legend>
            <div class="ship-options" id="ship-picker"></div>
          </fieldset>
          <fieldset>
            <legend>Choose orientation</legend>
            <div class="orientation-options">
              <label>
                <input type="radio" name="orientation" value="horizontal" checked>
                Horizontal
              </label>
              <label>
                <input type="radio" name="orientation" value="vertical">
                Vertical
              </label>
            </div>
          </fieldset>
        </div>
        <div class="placement-actions">
          <button id="randomize-fleet" type="button">Randomize fleet</button>
          <button id="confirm-placement" type="button" disabled>Confirm placement</button>
          <button id="start-game" type="button" disabled>Start game</button>
          <p id="placement-status" role="status" aria-live="polite">
            Select a ship and choose a starting square to preview its placement.
          </p>
        </div>
      </section>

      <p id="turn-status" role="status" aria-live="polite"></p>
      <p><button id="restart-game" type="button">Restart</button></p>
      <p id="play-again-container" hidden>
        <button id="play-again" type="button">Play again</button>
      </p>

      <section class="board-layout" aria-label="Game boards">
        <section class="board-panel" aria-labelledby="human-board-heading">
          <h2 id="human-board-heading">Your board</h2>
          <div class="board-scroll">
            <table class="board-table" id="human-board"></table>
          </div>
        </section>
        <section class="board-panel" aria-labelledby="computer-board-heading">
          <h2 id="computer-board-heading">Computer board</h2>
          <div class="board-scroll">
            <table class="board-table" id="computer-board"></table>
          </div>
        </section>
      </section>
    </main>
    <script>
      const GAME_DEFINITION = Object.freeze({
        board: Object.freeze({
          rows: 10,
          columns: 10,
          rowLabels: Object.freeze(Array.from({ length: 10 }, (_, index) => index + 1)),
          columnLabels: Object.freeze("ABCDEFGHIJ".split("")),
        }),
        participants: Object.freeze([
          Object.freeze({ id: "human", name: "Human" }),
          Object.freeze({ id: "computer", name: "Computer" }),
        ]),
        fleet: Object.freeze([
          Object.freeze({ id: "battleship", type: "battleship", length: 4 }),
          Object.freeze({ id: "cruiser", type: "cruiser", length: 3 }),
          Object.freeze({ id: "destroyer", type: "destroyer", length: 3 }),
          Object.freeze({ id: "submarine-1", type: "submarine", length: 2 }),
          Object.freeze({ id: "submarine-2", type: "submarine", length: 2 }),
        ]),
      });

      const GAME_PHASE = Object.freeze({
        setup: "setup",
        playing: "playing",
        finished: "finished",
      });

      function createShipState(definition) {
        return {
          id: definition.id,
          type: definition.type,
          length: definition.length,
          cells: [],
          hits: new Set(),
        };
      }

      function createBoardState(participant) {
        return {
          participantId: participant.id,
          rows: GAME_DEFINITION.board.rows,
          columns: GAME_DEFINITION.board.columns,
          ships: GAME_DEFINITION.fleet.map(createShipState),
          shots: new Map(),
        };
      }

      function createInitialGameState() {
        return {
          phase: GAME_PHASE.setup,
          turn: null,
          winner: null,
          boards: Object.fromEntries(
            GAME_DEFINITION.participants.map(participant => [
              participant.id,
              createBoardState(participant),
            ]),
          ),
        };
      }

      function isShipSunk(ship) {
        return ship.cells.length === ship.length && ship.hits.size === ship.length;
      }

      let gameState = createInitialGameState();
      let selectedShipId = GAME_DEFINITION.fleet[0].id;
      let placementPreview = null;

      function getShipCells(row, column, length, orientation) {
        if (orientation !== "horizontal" && orientation !== "vertical") {
          throw new RangeError("Orientation must be horizontal or vertical.");
        }
        if (!Number.isInteger(row) || !Number.isInteger(column) ||
            !Number.isInteger(length) || length < 1) {
          throw new RangeError("Ship coordinates and length must be integers.");
        }

        return Array.from({ length }, (_, index) => ({
          row: orientation === "vertical" ? row + index : row,
          column: orientation === "horizontal" ? column + index : column,
        }));
      }

      function isPlacementValid(ships, cells) {
        if (!Array.isArray(ships) || !Array.isArray(cells) || cells.length === 0) {
          return false;
        }

        const proposedKeys = new Set();
        for (const cell of cells) {
          if (!Number.isInteger(cell?.row) || !Number.isInteger(cell?.column) ||
              cell.row < 0 || cell.row >= GAME_DEFINITION.board.rows ||
              cell.column < 0 || cell.column >= GAME_DEFINITION.board.columns) {
            return false;
          }
          const key = `${cell.row},${cell.column}`;
          if (proposedKeys.has(key)) return false;
          proposedKeys.add(key);
        }

        const sameRow = cells.every(cell => cell.row === cells[0].row);
        const sameColumn = cells.every(cell => cell.column === cells[0].column);
        if (!sameRow && !sameColumn) return false;

        const lineCoordinates = cells
          .map(cell => sameRow ? cell.column : cell.row)
          .sort((a, b) => a - b);
        if (lineCoordinates.some((coordinate, index) =>
          index > 0 && coordinate !== lineCoordinates[index - 1] + 1)) {
          return false;
        }

        const occupiedKeys = new Set();
        for (const ship of ships) {
          if (!Array.isArray(ship.cells)) return false;
          for (const cell of ship.cells) {
            if (!Number.isInteger(cell?.row) || !Number.isInteger(cell?.column) ||
                cell.row < 0 || cell.row >= GAME_DEFINITION.board.rows ||
                cell.column < 0 || cell.column >= GAME_DEFINITION.board.columns) {
              return false;
            }
            occupiedKeys.add(`${cell.row},${cell.column}`);
          }
        }

        return [...proposedKeys].every(key => !occupiedKeys.has(key));
      }

      function shuffleInPlace(items, random) {
        for (let index = items.length - 1; index > 0; index--) {
          const swapIndex = Math.floor(random() * (index + 1));
          [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
        }
        return items;
      }

      function createRandomFleet(random = Math.random) {
        if (typeof random !== "function") {
          throw new TypeError("Random source must be a function.");
        }

        const candidatePlacements = GAME_DEFINITION.fleet.map(ship => {
          const candidates = [];
          for (const orientation of ["horizontal", "vertical"]) {
            for (let row = 0; row < GAME_DEFINITION.board.rows; row++) {
              for (let column = 0; column < GAME_DEFINITION.board.columns; column++) {
                const cells = getShipCells(row, column, ship.length, orientation);
                if (cells.every(cell =>
                  cell.row < GAME_DEFINITION.board.rows &&
                  cell.column < GAME_DEFINITION.board.columns)) {
                  candidates.push(cells);
                }
              }
            }
          }
          return shuffleInPlace(candidates, random);
        });

        function placeNextShip(index, placedShips) {
          if (index === GAME_DEFINITION.fleet.length) return placedShips;

          const definition = GAME_DEFINITION.fleet[index];
          for (const cells of candidatePlacements[index]) {
            if (!isPlacementValid(placedShips, cells)) continue;
            const ship = { ...definition, cells };
            const completeFleet = placeNextShip(index + 1, [...placedShips, ship]);
            if (completeFleet) return completeFleet;
          }
          return null;
        }

        const fleet = placeNextShip(0, []);
        if (!fleet) {
          throw new Error("Could not generate a legal fleet for the defined ships.");
        }
        return fleet;
      }

      function renderBoard(table, boardName, interactive = false) {
        const caption = document.createElement("caption");
        caption.className = "visually-hidden";
        caption.textContent = `${boardName}, columns A through J and rows 1 through 10`;
        table.append(caption);

        const head = document.createElement("thead");
        const headerRow = document.createElement("tr");
        const corner = document.createElement("th");
        corner.className = "coordinate-corner";
        corner.scope = "col";
        corner.textContent = "";
        headerRow.append(corner);

        for (const columnLabel of GAME_DEFINITION.board.columnLabels) {
          const header = document.createElement("th");
          header.scope = "col";
          header.textContent = columnLabel;
          headerRow.append(header);
        }

        head.append(headerRow);
        table.append(head);

        const body = document.createElement("tbody");
        for (const rowLabel of GAME_DEFINITION.board.rowLabels) {
          const row = document.createElement("tr");
          const rowHeader = document.createElement("th");
          rowHeader.scope = "row";
          rowHeader.textContent = String(rowLabel);
          row.append(rowHeader);

          for (const columnLabel of GAME_DEFINITION.board.columnLabels) {
            const tableCell = document.createElement("td");
            if (interactive) {
              const cell = document.createElement("button");
              cell.type = "button";
              cell.className = "board-cell";
              cell.dataset.row = String(rowLabel - 1);
              cell.dataset.column = String(GAME_DEFINITION.board.columnLabels.indexOf(columnLabel));
              cell.setAttribute("aria-label", `${boardName} ${columnLabel}${rowLabel}`);
              tableCell.append(cell);
            } else {
              tableCell.setAttribute("aria-label", `${boardName} ${columnLabel}${rowLabel}`);
            }
            row.append(tableCell);
          }

          body.append(row);
        }
        table.append(body);
      }

      function renderShipPicker(container) {
        container.replaceChildren();
        const humanShips = gameState.boards.human.ships;
        if (!humanShips.some(ship => ship.id === selectedShipId && ship.cells.length === 0)) {
          selectedShipId = humanShips.find(ship => ship.cells.length === 0)?.id ?? null;
        }

        GAME_DEFINITION.fleet.forEach((ship, index) => {
          const label = document.createElement("label");
          const input = document.createElement("input");
          input.type = "radio";
          input.name = "ship";
          input.value = ship.id;
          input.id = `ship-${ship.id}`;
          input.checked = ship.id === selectedShipId;
          input.disabled = humanShips.find(placedShip => placedShip.id === ship.id).cells.length > 0;

          const shipName = ship.type[0].toUpperCase() + ship.type.slice(1);
          const instanceName = ship.type === "submarine"
            ? `${shipName} ${index - 2}`
            : shipName;
          label.htmlFor = input.id;
          label.append(input, ` ${instanceName} (${ship.length} squares)`);
          container.append(label);
        });
      }

      const humanBoard = document.getElementById("human-board");
      const computerBoard = document.getElementById("computer-board");
      const shipPicker = document.getElementById("ship-picker");
      const randomizeFleetButton = document.getElementById("randomize-fleet");
      const confirmPlacementButton = document.getElementById("confirm-placement");
      const startGameButton = document.getElementById("start-game");
      const setupControls = document.querySelector(".setup-controls");
      const turnStatus = document.getElementById("turn-status");
      const placementStatus = document.getElementById("placement-status");
      const restartGameButton = document.getElementById("restart-game");
      const playAgainContainer = document.getElementById("play-again-container");
      const playAgainButton = document.getElementById("play-again");
      let pendingHumanShot = null;

      function getPlacementMessage(cells) {
        if (cells.some(cell =>
          cell.row < 0 || cell.row >= GAME_DEFINITION.board.rows ||
          cell.column < 0 || cell.column >= GAME_DEFINITION.board.columns)) {
          return "That placement extends beyond the board. Choose another starting square.";
        }
        return "That placement overlaps an existing ship. Choose another starting square.";
      }

      function updateHumanBoard() {
        const humanShips = gameState.boards.human.ships;
        const humanShots = gameState.boards.human.shots;
        const previewKeys = new Set(
          placementPreview?.cells.map(cell => `${cell.row},${cell.column}`) ?? [],
        );
        humanBoard.querySelectorAll(".board-cell").forEach(cell => {
          const row = Number(cell.dataset.row);
          const column = Number(cell.dataset.column);
          const key = `${row},${column}`;
          const isPreviewCell = previewKeys.has(key);
          const ship = humanShips.find(item =>
            item.cells.some(shipCell => shipCell.row === row && shipCell.column === column),
          );
          const isOccupied = ship !== undefined;
          const isSunk = ship ? isShipSunk(ship) : false;
          const shot = humanShots.get(key);
          const coordinate =
            `${GAME_DEFINITION.board.columnLabels[column]}${row + 1}`;
          cell.disabled = gameState.phase !== GAME_PHASE.setup;
          cell.classList.toggle("ship-cell", isOccupied);
          cell.classList.toggle(
            "preview-valid",
            isPreviewCell && placementPreview.valid,
          );
          cell.classList.toggle(
            "preview-invalid",
            isPreviewCell && !placementPreview.valid,
          );
          cell.classList.toggle("shot-hit", shot?.result === "hit");
          cell.classList.toggle("shot-miss", shot?.result === "miss");
          cell.classList.toggle("ship-sunk", isSunk);
          cell.setAttribute(
            "aria-pressed",
            String(isPreviewCell || isOccupied || shot !== undefined),
          );
          cell.setAttribute(
            "aria-label",
            `Your board ${coordinate}${isOccupied ? ", ship" : ""}${
              shot?.result === "hit"
                ? ", hit"
                : shot?.result === "miss"
                  ? ", miss"
                  : ""
            }${isSunk ? ", sunk" : ""}`,
          );
          cell.textContent = shot?.result === "hit"
            ? "X"
            : shot?.result === "miss"
              ? "O"
              : isOccupied
                ? "S"
                : isPreviewCell
                  ? "+"
                  : "";
        });
      }

      function updatePlacementControls() {
        updateHumanBoard();
        updateComputerBoard();
        confirmPlacementButton.disabled = placementPreview === null;
        startGameButton.disabled =
          gameState.phase !== GAME_PHASE.setup ||
          !isFleetLegal(gameState.boards.human.ships);
      }

      function updateComputerBoard() {
        const computerShots = gameState.boards.computer.shots;
        const humanCanTarget =
          gameState.phase === GAME_PHASE.playing &&
          gameState.turn === "human" &&
          pendingHumanShot === null;

        computerBoard.querySelectorAll(".board-cell").forEach(cell => {
          const row = Number(cell.dataset.row);
          const column = Number(cell.dataset.column);
          const key = `${row},${column}`;
          const isPending = pendingHumanShot?.key === key;
          const shot = computerShots.get(key);
          const hasBeenTargeted = shot !== undefined;
          const hitShip = gameState.boards.computer.ships.find(ship =>
            ship.cells.some(shipCell => shipCell.row === row && shipCell.column === column),
          );
          const isSunk = hitShip ? isShipSunk(hitShip) : false;
          const coordinate =
            `${GAME_DEFINITION.board.columnLabels[column]}${row + 1}`;
          cell.disabled = !humanCanTarget || hasBeenTargeted;
          cell.classList.toggle("target-pending", isPending);
          cell.classList.toggle("shot-hit", shot?.result === "hit");
          cell.classList.toggle("shot-miss", shot?.result === "miss");
          cell.classList.toggle("ship-sunk", isSunk);
          cell.setAttribute("aria-pressed", String(hasBeenTargeted));
          cell.setAttribute(
            "aria-label",
            `Computer board ${coordinate}${shot?.result === "hit"
              ? ", hit"
              : shot?.result === "miss"
                ? ", miss"
                : ""}${isSunk ? ", sunk" : ""}`,
          );
          cell.textContent = shot?.result === "hit"
            ? "X"
            : shot?.result === "miss"
              ? "O"
              : "";
        });
      }

      function getSunkMessage(ship, owner) {
        const shipName = ship.type[0].toUpperCase() + ship.type.slice(1);
        return owner === "computer"
          ? `Computer ${shipName.toLowerCase()} sunk.`
          : `Your ${shipName.toLowerCase()} was sunk.`;
      }

      function finishGame(winner, message) {
        gameState.phase = GAME_PHASE.finished;
        gameState.turn = null;
        gameState.winner = winner;
        pendingHumanShot = null;
        turnStatus.textContent = message;
        playAgainContainer.hidden = false;
        updatePlacementControls();
      }

      function resolveHumanShot(event) {
        const { row, column } = event.detail;
        const key = `${row},${column}`;
        const shot = gameState.boards.computer.shots.get(key);
        if (gameState.phase !== GAME_PHASE.playing ||
            gameState.turn !== "human" ||
            pendingHumanShot?.key !== key ||
            !shot ||
            shot.result !== "pending") {
          turnStatus.textContent = "The selected shot could not be resolved.";
          return;
        }

        const hitShip = gameState.boards.computer.ships.find(ship =>
          ship.cells.some(cell => cell.row === row && cell.column === column),
        );
        const result = hitShip ? "hit" : "miss";
        if (hitShip) hitShip.hits.add(key);
        gameState.boards.computer.shots.set(key, {
          ...shot,
          result,
        });
        pendingHumanShot = null;
        const shipWasSunk = hitShip !== undefined && isShipSunk(hitShip);
        const playerWon = gameState.boards.computer.ships.every(isShipSunk);
        if (playerWon) {
          finishGame("human", "Congrats, you won!");
          computerBoard.dispatchEvent(new CustomEvent("human-shot-resolved", {
            detail: { row, column, result, terminal: true },
          }));
          return;
        }

        gameState.turn = "computer";

        const coordinate =
          `${GAME_DEFINITION.board.columnLabels[column]}${row + 1}`;
        turnStatus.textContent =
          `${result === "hit" ? "Hit" : "Miss"} at ${coordinate}.${shipWasSunk
            ? ` ${getSunkMessage(hitShip, "computer")}`
            : ""}`;
        updateComputerBoard();
        computerBoard.dispatchEvent(new CustomEvent("human-shot-resolved", {
          detail: { row, column, result, terminal: false },
        }));
      }

      function takeComputerTurn() {
        if (gameState.phase !== GAME_PHASE.playing ||
            gameState.turn !== "computer") {
          return;
        }

        if (gameState.boards.computer.ships.every(isShipSunk)) return;

        const humanAnnouncement = turnStatus.textContent;
        const humanBoardState = gameState.boards.human;
        const unshotCoordinates = [];
        for (let row = 0; row < humanBoardState.rows; row++) {
          for (let column = 0; column < humanBoardState.columns; column++) {
            const key = `${row},${column}`;
            if (!humanBoardState.shots.has(key)) {
              unshotCoordinates.push({ row, column, key });
            }
          }
        }
        if (unshotCoordinates.length === 0) {
          throw new Error("Computer has no unshot coordinates remaining.");
        }

        const { row, column, key } = unshotCoordinates[
          Math.floor(Math.random() * unshotCoordinates.length)
        ];
        const hitShip = humanBoardState.ships.find(ship =>
          ship.cells.some(cell => cell.row === row && cell.column === column),
        );
        const result = hitShip ? "hit" : "miss";
        if (hitShip) hitShip.hits.add(key);
        humanBoardState.shots.set(key, {
          attacker: "computer",
          result,
        });
        const shipWasSunk = hitShip !== undefined && isShipSunk(hitShip);
        const computerWon = humanBoardState.ships.every(isShipSunk);
        if (computerWon) {
          finishGame("computer", "Game over! Computer wins.");
          humanBoard.dispatchEvent(new CustomEvent("computer-shot-resolved", {
            detail: { row, column, result, terminal: true },
          }));
          return;
        }

        gameState.turn = "human";

        const coordinate =
          `${GAME_DEFINITION.board.columnLabels[column]}${row + 1}`;
        turnStatus.textContent =
          `${humanAnnouncement} Computer ${result} at ${coordinate}.${shipWasSunk
            ? ` ${getSunkMessage(hitShip, "human")}`
            : ""} Your turn.`;
        updatePlacementControls();
        humanBoard.dispatchEvent(new CustomEvent("computer-shot-resolved", {
          detail: { row, column, result, terminal: false },
        }));
      }

      function targetComputerSquare(cell) {
        const row = Number(cell.dataset.row);
        const column = Number(cell.dataset.column);
        const key = `${row},${column}`;
        const isCoordinateValid =
          Number.isInteger(row) && Number.isInteger(column) &&
          row >= 0 && row < GAME_DEFINITION.board.rows &&
          column >= 0 && column < GAME_DEFINITION.board.columns;

        if (gameState.phase !== GAME_PHASE.playing || gameState.turn !== "human") {
          turnStatus.textContent = "Wait for your turn to target the computer board.";
          return;
        }
        if (!isCoordinateValid) {
          turnStatus.textContent = "That is not a valid board coordinate.";
          return;
        }
        if (gameState.boards.computer.shots.has(key)) {
          turnStatus.textContent = "That square has already been targeted.";
          return;
        }
        if (pendingHumanShot !== null) {
          turnStatus.textContent = "Your selected shot is being resolved.";
          return;
        }

        pendingHumanShot = { row, column, key };
        gameState.boards.computer.shots.set(key, {
          attacker: "human",
          result: "pending",
        });
        const coordinate =
          `${GAME_DEFINITION.board.columnLabels[column]}${row + 1}`;
        turnStatus.textContent = `Target selected: ${coordinate}.`;
        updateComputerBoard();
        computerBoard.dispatchEvent(new CustomEvent("human-shot", {
          detail: { row, column },
        }));
      }

      function isFleetLegal(ships) {
        if (!Array.isArray(ships) || ships.length !== GAME_DEFINITION.fleet.length) {
          return false;
        }

        const remainingShips = [...ships];
        for (const definition of GAME_DEFINITION.fleet) {
          const index = remainingShips.findIndex(ship =>
            ship.id === definition.id &&
            ship.type === definition.type &&
            ship.length === definition.length &&
            Array.isArray(ship.cells) &&
            ship.cells.length === definition.length,
          );
          if (index === -1) return false;

          const [ship] = remainingShips.splice(index, 1);
          if (!isPlacementValid(remainingShips, ship.cells)) return false;
          remainingShips.push(ship);
        }
        return remainingShips.length === GAME_DEFINITION.fleet.length;
      }

      function startGame() {
        if (gameState.phase !== GAME_PHASE.setup ||
            !isFleetLegal(gameState.boards.human.ships)) {
          updatePlacementControls();
          placementStatus.textContent =
            "Place all five ships legally before starting the game.";
          return;
        }

        const computerFleet = createRandomFleet();
        for (const randomizedShip of computerFleet) {
          const ship = gameState.boards.computer.ships.find(
            item => item.id === randomizedShip.id,
          );
          if (!ship) {
            throw new Error(`Randomized fleet contains an unknown ship: ${randomizedShip.id}`);
          }
          ship.cells = randomizedShip.cells.map(cell => ({ ...cell }));
        }

        gameState.phase = GAME_PHASE.playing;
        gameState.turn = "human";
        gameState.winner = null;
        placementPreview = null;
        setupControls.hidden = true;
        turnStatus.textContent =
          "Your turn. Select an unshot square on the computer board.";
        updatePlacementControls();
      }

      function restartGame() {
        gameState = createInitialGameState();
        for (const randomizedShip of createRandomFleet()) {
          const ship = gameState.boards.computer.ships.find(
            item => item.id === randomizedShip.id,
          );
          if (!ship) {
            throw new Error(`Randomized fleet contains an unknown ship: ${randomizedShip.id}`);
          }
          ship.cells = randomizedShip.cells.map(cell => ({ ...cell }));
        }

        selectedShipId = GAME_DEFINITION.fleet[0].id;
        placementPreview = null;
        pendingHumanShot = null;
        setupControls.hidden = false;
        playAgainContainer.hidden = true;
        document.querySelector('input[name="orientation"][value="horizontal"]').checked = true;
        placementStatus.textContent =
          "Select a ship and choose a starting square to preview its placement.";
        turnStatus.textContent = "";
        renderShipPicker(shipPicker);
        updatePlacementControls();
      }

      function playAgain() {
        if (gameState.phase !== GAME_PHASE.finished) return;
        restartGame();
      }

      function randomizeHumanFleet() {
        if (gameState.phase !== GAME_PHASE.setup) return;

        const randomizedFleet = createRandomFleet();
        for (const randomizedShip of randomizedFleet) {
          const ship = gameState.boards.human.ships.find(
            item => item.id === randomizedShip.id,
          );
          if (!ship) {
            throw new Error(`Randomized fleet contains an unknown ship: ${randomizedShip.id}`);
          }
          ship.cells = randomizedShip.cells.map(cell => ({ ...cell }));
          ship.hits.clear();
        }

        placementPreview = null;
        selectedShipId = null;
        placementStatus.textContent = "Your complete fleet has been placed randomly.";
        renderShipPicker(shipPicker);
        updatePlacementControls();
      }

      function previewPlacement(row, column) {
        if (gameState.phase !== GAME_PHASE.setup || !selectedShipId) return;
        const ship = gameState.boards.human.ships.find(item => item.id === selectedShipId);
        if (!ship || ship.cells.length > 0) return;

        const orientation = document.querySelector('input[name="orientation"]:checked').value;
        const cells = getShipCells(row, column, ship.length, orientation);
        placementPreview = {
          shipId: ship.id,
          row,
          column,
          orientation,
          cells,
          valid: isPlacementValid(gameState.boards.human.ships, cells),
        };
        placementStatus.textContent = placementPreview.valid
          ? `Preview: ${ship.type} occupies ${cells.length} squares. Confirm placement or choose another starting square.`
          : getPlacementMessage(cells);
        updatePlacementControls();
      }

      shipPicker.addEventListener("change", event => {
        if (event.target.name !== "ship") return;
        selectedShipId = event.target.value;
        placementPreview = null;
        placementStatus.textContent = "Select a starting square to preview this ship.";
        updatePlacementControls();
      });

      document.querySelectorAll('input[name="orientation"]').forEach(input => {
        input.addEventListener("change", () => {
          if (placementPreview) {
            previewPlacement(placementPreview.row, placementPreview.column);
          }
        });
      });

      humanBoard.addEventListener("click", event => {
        const cell = event.target.closest(".board-cell");
        if (!cell) return;
        previewPlacement(Number(cell.dataset.row), Number(cell.dataset.column));
      });

      computerBoard.addEventListener("click", event => {
        const cell = event.target.closest(".board-cell");
        if (!cell) return;
        targetComputerSquare(cell);
      });
      computerBoard.addEventListener("human-shot", resolveHumanShot);
      computerBoard.addEventListener(
        "human-shot-resolved",
        takeComputerTurn,
      );

      randomizeFleetButton.addEventListener("click", randomizeHumanFleet);
      startGameButton.addEventListener("click", startGame);
      restartGameButton.addEventListener("click", restartGame);
      playAgainButton.addEventListener("click", playAgain);

      confirmPlacementButton.addEventListener("click", () => {
        if (!placementPreview) return;
        const ship = gameState.boards.human.ships.find(
          item => item.id === placementPreview.shipId,
        );
        if (!ship || ship.cells.length > 0 ||
            !isPlacementValid(gameState.boards.human.ships, placementPreview.cells)) {
          placementPreview.valid = false;
          placementStatus.textContent = getPlacementMessage(placementPreview.cells);
          updateHumanBoard();
          return;
        }

        if (!placementPreview.valid) {
          placementStatus.textContent = getPlacementMessage(placementPreview.cells);
          return;
        }

        ship.cells = placementPreview.cells.map(cell => ({ ...cell }));
        placementPreview = null;
        placementStatus.textContent = `${ship.type[0].toUpperCase()}${ship.type.slice(1)} placed. Select the next unplaced ship.`;
        renderShipPicker(shipPicker);
        updatePlacementControls();
      });

      renderBoard(humanBoard, "Your board", true);
      renderBoard(computerBoard, "Computer board", true);
      renderShipPicker(shipPicker);
      updatePlacementControls();
    </script>
  </body>
</html>
